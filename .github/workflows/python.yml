name: pytest

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create the virtual environment
        run: uv venv --python ${{ matrix.python-version }}
      # TEMPORARY: cadbuildr-foundation 0.3.0 is not on PyPI yet. Install it
      # from the foundation repo's master, then this package without
      # re-resolving foundation. Replace both steps with `uv sync --dev`
      # (and commit a fresh uv.lock) once 0.3.0 is published.
      - name: Install foundation from git (temporary)
        run: uv pip install "cadbuildr-foundation @ git+https://github.com/cadbuildr/foundation@master"
      - name: Install this package and test deps
        run: |
          uv pip install --no-deps -e .
          uv pip install "pytest>=8,<9"
      - name: Test with pytest
        run: uv run --no-sync pytest tests -q
